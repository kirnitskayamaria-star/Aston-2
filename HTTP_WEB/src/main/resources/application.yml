spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/user_service_db
    username: postgres
    password: astontest
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
springdoc:
  openapi:
    info:
      title: User Management API
      version: 1.0.0
      description: Документация API для управления пользователями и навигации по ресурсам (HATEOAS)
  swagger-ui:
    operations-sorter: alpha

server:
  error:
    include-binding-errors: always
    include-message: always
